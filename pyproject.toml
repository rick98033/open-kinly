[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "open-kinly"
version = "0.1.0"
description = "A minimal reference implementation of schema-constrained semantic compilation for phone-use agents"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6,<7",
]

[project.scripts]
open-kinly = "open_kinly.cli:main"

[tool.setuptools.package-data]
open_kinly = ["toy_catalog.yaml"]
